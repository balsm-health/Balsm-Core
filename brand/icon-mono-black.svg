<title>Balsm</title>
<!-- Balsm mark, five-fold symmetric. Source: Balsm-Draft assets/circle/27-vector.svg
     (traced from assets/circle/4.png; pipeline and notes in assets/circle/4-svg/27-pipeline).

     ONE RIBBON, ONE HEAD, FIVE TIMES. #ribbon is a single closed path and #head a single
     circle; every ribbon is a <use> of them turned by rotate(72k 374.5 383). The seam
     where two ribbons meet is the same curve in both copies (exact to 0.001), so the ring
     reads as one band.

     FRAME. The viewBox IS the ink box (21.64 15 705.72 x 676.92, aspect 1.0425),
     rounded outward to 0.01: no padding on any side, the heads set all four edges.
     scripts/brand/build-brand-assets.py hard-codes it as MARK_INK: update it if the geometry
     changes. Square frames centre the ink box. A head-up five-fold mark is always wider than
     tall, so in a square each vertical margin is 14.4 units (scaled) larger than
     each horizontal one; only turning the mark 9.00 degrees makes all four equal. The
     rotation centre sits 29.5 units below the ink box centre; the enclosing circle about
     it has radius 367.995. Under a circular mask the lower heads stay whole only while the mark
     width is at most 0.899 of the frame, so pad circular exports.

     JOINS. Where two ribbons abut, the union outline crosses from one copy to the next at
     two points, and both are curvature-continuous (G1 and G2, to 1e-5) so the ring reads as
     one unbroken band rather than five pieces butted together:
       outer join, at (257.162 128.139) = rotate(72) of (580.628 192.649)
         governed by the last control point of the closing curve and the first of the curve
         that leaves (580.628 192.649).
       inner join, at (240.141 220.338) = rotate(72) of (487.682 204.952)
         governed by the first control point of the curve leaving (240.141 220.338) and the
         last of the curve arriving at (487.682 204.952). This pair used to meet at a 66.2
         degree corner, which spiked the inner negative space; the handles now share one
         tangent and one curvature, giving a fillet of radius about 12.5.
     Only those four control points set the joins. Endpoints, the seam curve and the ink box
     are untouched by them, so a regeneration that moves them must re-solve both joins.

     SEAMS. Two abutting antialiased fills leave about a quarter of the background showing
     down their shared edge. #seam is a closed sliver 1.6 wide along that shared curve
     (the ribbon's head seam) trimmed one unit short of each corner; it is FILLED with each
     ribbon's own gradient UNDER the fills, so the seams close but the outline is still drawn
     once and stays a single soft edge. Nothing is stroked and nothing is clipped: a stroke
     would vanish under the mono fill regex, and a clip-path hardens the outline in rsvg.
     Do not stroke #ribbon itself: that pushes the outline out and draws it twice.

     COLOUR is the brand hue palette (design-system/colors_and_type.css), clockwise from the top in
     the order of the previous icon.svg: aqua, blue, emerald, violet, mint. The five
     gradient-<hue> fills inherit one #ribbon-axis (userSpaceOnUse, unrotated frame; the
     rotate lives on each <use>, so the paint turns with its ribbon) and share one OKLab
     lightness profile: deep at
     the leading seam, light at the trailing seam, clockwise, the same depth on every ribbon,
     smoothed (largest slope jump 0.12). The profile's zero is the base token, present as an
     exact stop at offset 0.435; hues follow each hue's 600 -> base -> light ramp. The
     head-<hue> fills are the previous icon's dot colours with one shared lightness step, on
     the previous icon's head axis (#head-axis: top edge to bottom edge, light end 21.8
     degrees counter-clockwise from outward). Regenerate with the pipeline (polish.py,
     brandmaster.py) rather than hand-editing hexes. -->
