<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.28 9.17 680.45 653.39" width="680.45" height="653.39" role="img" aria-label="Balsm - five identical figures joined in a symmetric ring">
 <!-- Balsm mark, five-fold symmetric variant.
      Petal outline is the pre-02add880 kidney (rounded cradle, not gear teeth).
      Five copies rotate about (350.27, 363.854). viewBox is this file's
      ink bbox: 10.28,9.17 680.45x653.39.

      Leading/trailing are the same curve (trailing = leading ×72° reversed)
      so the five tile. The outer cradle is a 72°-periodic radial fairing
      (6 harmonics of r(θ) about the ring centre, refit as 16 cubics), so the
      ring silhouette is G2 across every seam — tangent break 0.10° and
      curvature jump 0.0006, down from 55° / 0.12 which read as a nick at
      each seam. Fairing lifts the seam point 1.34u outward (r 282.86 →
      284.21); the leading seam absorbs that with a smoothstep radial decay
      to zero by r 244, so segments inward of the seam are untouched. Ink
      bbox is dot-driven and unchanged — do not touch viewBox. #ring-clip is
      five copies of the tile so remaining tucks stay round at mark size —
      no matching stroke (a stroke fattens at favicon size).

      NOTE: scripts/brand/build-brand-assets.py reads brand/icon.svg, not
      this file. Do not sync MARK_INK unless this file replaces icon.svg.

      Paint stays userSpaceOnUse at the unrotated top head (351.03, 68.41)
      / r 430 and the top dot ramp (327.3,9.2 → 374.7,127.7). The rotate
      lives on a parent <g>, not on <use>. Do not add gradientTransform
      rotate(...) here. Do not switch to objectBoundingBox.

      Everything else in brand/ is generated - see scripts/brand/build-brand-assets.py. -->
