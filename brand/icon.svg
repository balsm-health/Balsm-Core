<linearGradient id="gradient-violet" href="#ribbon-axis"><stop offset="0" stop-color="#4A2299"/><stop offset="0.062" stop-color="#512CA2"/><stop offset="0.125" stop-color="#5A37AD"/><stop offset="0.188" stop-color="#613EB7"/><stop offset="0.25" stop-color="#6643BF"/><stop offset="0.312" stop-color="#6B47C5"/><stop offset="0.375" stop-color="#6E4ACB"/><stop offset="0.435" stop-color="#724DD0"/><stop offset="0.5" stop-color="#7652D2"/><stop offset="0.562" stop-color="#7957D3"/><stop offset="0.625" stop-color="#7C5CD5"/><stop offset="0.688" stop-color="#8060D5"/><stop offset="0.75" stop-color="#8464D6"/><stop offset="0.812" stop-color="#8668D8"/><stop offset="0.875" stop-color="#886AD8"/><stop offset="0.938" stop-color="#896BD9"/><stop offset="1" stop-color="#8769D8"/></linearGradient>
