<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.28 9.17 680.45 653.39" width="680.45" height="653.39" role="img" aria-label="Balsm - five identical figures joined in a symmetric ring">
 <!-- Balsm mark, five-fold symmetric variant.
      Five copies of one petal rotate about (350.27, 363.854). viewBox is
      this file's ink bbox: 10.28,9.17 680.45x653.39 — dot-driven (ring
      spans r 128.4..289.5, well inside), so curve edits never change it.

      BOTH RING EDGES ARE ONE SMOOTH CLOSED CURVE. The outer silhouette and
      the inner hole are each a single 72°-periodic G2 curve that runs
      through all five junctions without a break; the colour seams are
      chords that meet those edges at an angle. Every junction is therefore
      a clean T: the ring edge passes straight through (180°) and the seam
      arrives at -42°/-138° on the inside, -84°/-96° on the outside. Those
      four are the only corners in the outline. Everywhere else the curve is
      G2 — max curvature jump at a joint is 3e-5, max tangent break 0.004°.

      Do not hand-edit control points. Regenerate instead: one dragged
      handle reintroduces the curvature sawtooth this was built to remove
      (RMS d2k/ds2 went 1.05 -> 0.0015, wiggle count 39 -> 11).

      Construction, in order:
      1. OUTER EDGE. r(theta) about the ring centre, 6 harmonics, exactly
         72°-periodic; sampled at 20 arclength-uniform knots per petal and
         fitted as ONE periodic C2 spline over all 360°. Before this the
         seam was a 55° notch.
      2. INNER EDGE. Same recipe, 6 harmonics, 22 cubics per petal. Before
         this the two arms met at a 100° break with a visible hitch — one
         side arrived nearly straight, the other fell away. Rounding the
         corner pulls each star tip in 5.3u (r 206.3 -> 201.0); that is the
         whole visual change and it is intentional. Tip radius is now 26.6u.
         Because the edge is r(theta) over exactly 72°, theta is strictly
         monotone, which makes a spur structurally impossible here — the old
         edge folded back on itself and left a 0.8u detached filament plus a
         0.077u uncovered wedge.
      3. SEAM. The leading seam is retargeted onto the new inner edge with a
         smoothstep radial decay (full at the tip, zero at the outer end) and
         refitted as a clamped C2 spline.
      4. TRAILING = rot(reverse(leading), 72), generated, never hand-edited.
         That plus 4-decimal coordinates keeps the shared seam crack under
         1e-3u; at 2 decimals it was 8e-3u and rendered as a hairline
         between neighbouring figures.

      ONE PETAL, FIVE TIMES. There is a single #ring-petal-shape-smooth
      path and a single #dot-petal-shape circle. Every petal is the same
      <use> of that path, differing only by rotate(72k 350.27 363.854), and
      they share ONE fill — url(#f-ribbon) sits on the parent <g id="ring">,
      not on the individual petals. Same for the heads and #f-head. Nothing
      about a petal is per-instance. If you need to change the mark's paint
      or shape, there is exactly one place for each.

      The five <use> elements are listed THREE times. Two abutting
      antialiased fills leave a hairline down the shared seam — coverage
      sums to 0.75, not 1.0 — and because every petal now carries the SAME
      paint there is no colour step to hide it; it shows plainly, worst in
      the mono exports. Two passes reach 0.94 and the line is still faintly
      there; three reach 0.996 and it is gone. It costs ten lines, changes
      no geometry, and keeps every petal identical — which a stroke would
      not, since stroke paint is invisible to the mono regex below.

      PAINT — a rotating ribbon. The gradient is the design system's
      grad-petal (design-system token) sweep (aqua #02BBB5 -> blue #1283FF at 60% -> violet
      #724DD0), laid along the ring on the axis (149.915,-37.392) ->
      (433.114,-108.028). That axis is the least-squares "constant along the
      leading seam, constant along the trailing seam" direction, so the
      sweep runs ALONG the band rather than across it.

      Because the gradient is userSpaceOnUse in the unrotated frame and the
      rotate lives on each <use>, the paint rotates with its petal — which
      is exactly what makes five identical elements read as one band turning
      through the ring. The violet->aqua step at each seam is the wrap of
      that sweep; it is what keeps the five figures legible. Do not add
      gradientTransform rotate(...) to compensate for it, and do not switch
      to objectBoundingBox — either one breaks the shared-paint property and
      forces five per-petal gradients back into the file.

      Every mark paint is fill="url(...)" with no solid fills, which is what
      lets build-brand-assets.py swap the whole mark to mono with one regex.
      Keep it that way.

      #ring-clip is five copies of the tile — no matching stroke (a stroke
      fattens at favicon size).

      NOTE: scripts/brand/build-brand-assets.py reads brand/icon.svg.
      Everything else in brand/ is generated from it. -->
<defs>
<linearGradient id="f-ribbon" gradientUnits="userSpaceOnUse" x1="149.915" y1="-37.392" x2="433.114" y2="-108.028">
  <stop offset="0" stop-color="#02BBB5" />
  <stop offset="0.6" stop-color="#1283FF" />
  <stop offset="1" stop-color="#724DD0" />
</linearGradient>
<linearGradient id="f-head" gradientUnits="userSpaceOnUse" x1="327.3" y1="9.2" x2="374.7" y2="127.7">
  <stop offset="0" stop-color="#2E86E8" />
  <stop offset="1" stop-color="#2470D0" />
</linearGradient>
