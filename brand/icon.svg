<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.28 9.17 680.45 653.39" width="680.45" height="653.39" role="img" aria-label="Balsm - five identical figures joined in a symmetric ring">
 <!-- Balsm mark, five-fold symmetric variant.
      Five petals rotate about (350.27, 363.854). viewBox is this file's ink
      bbox: 10.28,9.17 680.45x653.39, dot-driven (ring spans r 128.4..289.5),
      so curve edits never change it.

      ONE PETAL, FIVE TIMES. There is a single #ring-petal-shape-smooth path
      and a single #dot-petal-shape circle. Every petal is the same <use> of
      that path; only rotate(72k 350.27 363.854) and the fill reference
      differ. The gradient GEOMETRY is shared too: #f-axis carries the
      coordinates and f-1..f-5 inherit it by href, overriding stops only.
      Same for #f-head-axis and f-h1..f-h5. One place to change the shape,
      one place to change the gradient direction.

      The five <use> lines appear THREE times. Two abutting antialiased
      fills leave a hairline down the shared seam, coverage 0.75 not 1.0,
      and it shows wherever neighbouring colours are close and in every mono
      export. Three passes reach 0.996. Ten extra lines, no geometry change,
      and every petal stays identical in form. A stroke would be shorter but
      stroke paint is invisible to the mono regex.

      COLOUR is the official petal palette from
      design-system/colors_and_type.css, ARRANGED as in brand/logo.svg:

        rot   0  top          aqua     #029E99 to #02BBB5 to #02D8D1
        rot  72  right        blue     #0F6BCC to #1283FF to #489FFF
        rot 144  lower-right  emerald  #019A7F to #01C4A2 to #01EEC5
        rot 216  lower-left   violet   #5C3AB0 to #724DD0 to #9275DB
        rot 288  left         mint     #3FC366 to #55D77F to #77DF99

      Match logo.svg by COLOUR, never by gradient name: its names and the
      palette's disagree. logo.svg calls the top petal "teal" (#00C8D2),
      which is the palette's AQUA; it calls the lower-right "mint"
      (#00D69E), which is the palette's EMERALD; and its "emerald"
      (#5FD470) on the left is the palette's MINT. The two green names are
      swapped between the files. The mapping above is the minimum-total
      CIELAB bijection between logo.svg's five fills and the five petal
      tokens (total dE 40.9, worst single 13.9), not a name lookup. The
      token comments in the CSS assign different positions again (aqua
      top-left, emerald top); logo.svg wins here because it is the canonical
      mark.

      Each figure runs DEEP at its leading seam to LIGHT at its trailing
      seam, clockwise, which is what makes five separate shapes read as one
      band turning through the ring. Do not flip that direction on one
      figure. The ramp structure is taken from
      Balsm-Draft/assets/assets/circle/4.png, measured off the render: each
      figure there was sampled across five radial bands at 41 angular steps,
      outliers more than 45 degrees off its median hue discarded, and a
      linear RGB ramp fitted. Only the structure was kept; the hues are ours.

      The deep stop is the palette's own 600 step. The light stop mirrors
      it: the measured base-to-600 lightness drop, applied upward at the
      same hue and saturation (dL runs 0.057 for aqua to 0.106 for blue, so
      the figures do not all ramp equally, which is the palette's spacing
      rather than a mistake). Do not reach for the 50 washes for the light
      end; they are about +50% L and go chalky. If a token changes,
      regenerate rather than hand-editing these hexes.

      Gradient axis (149.915,-37.392) to (433.114,-108.028) is the
      least-squares "constant along the leading seam, constant along the
      trailing seam" direction, so the ramp runs along the band, not across
      it. It is userSpaceOnUse in the unrotated frame and the rotate lives
      on each <use>, so the paint turns with its petal. Do not add
      gradientTransform rotate(...) and do not switch to objectBoundingBox;
      either one breaks the shared-axis setup.

      Every mark paint is fill="url(...)" with no solid fills, which is what
      lets build-brand-assets.py swap the whole mark to mono with one regex.
      Keep it that way.

      NOTE: build-brand-assets.py reads brand/icon.svg; everything else in
      brand/ is generated from it. Its MARK_INK is (8.46, 9.17, 682.37,
      653.47) and no longer matches this viewBox. -->
<defs>
<linearGradient id="f-axis" gradientUnits="userSpaceOnUse" x1="149.915" y1="-37.392" x2="433.114" y2="-108.028" />
<linearGradient id="f-1" href="#f-axis">
  <stop offset="0" stop-color="#029E99" />
  <stop offset="0.5" stop-color="#02BBB5" />
  <stop offset="1" stop-color="#02D8D1" />
</linearGradient>
<linearGradient id="f-2" href="#f-axis">
