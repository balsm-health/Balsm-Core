<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" version="1.1" role="img" aria-label="Balsm">
<rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
<g transform="translate(71.4051,81.9460) scale(0.492910)" aria-label="Balsm">
<title>Balsm</title>
<!-- Balsm mark, five-fold symmetric. Source: Balsm-Draft assets/circle/27-vector.svg
     (traced from assets/circle/4.png; pipeline and notes in assets/circle/4-svg/27-pipeline).

     ONE RIBBON, ONE HEAD, FIVE TIMES. #ribbon is a single closed path and #head a single
     circle; every ribbon is a <use> of them turned by rotate(72k 374.5 383), so the five-fold
     symmetry is structural — nothing to keep in step by hand. Inside the one path the seam is
     symmetric too: the trailing wedge is written as the exact rotation of the leading cap
     (they agree to 5e-7, the limit of the 6-decimal coordinates), so where two copies abut
     the same curve bounds both and the ring reads as one band. The path closes exactly and
     the ink box is centred on the rotation axis to within 1e-4.

     FRAME. The viewBox IS the ink box (18.24 11.42 712.52 x 683.39, aspect 1.0426),
     rounded outward to 0.01: no padding on any side, the heads set all four edges.
     scripts/brand/build-brand-assets.py hard-codes it as MARK_INK: update it if the geometry
     changes. The rotation centre sits 29.88 units below the ink box centre — the heads set
     the box, the top one alone sets its top edge — and the enclosing circle about it has
     radius 371.570. Square and circular frames (build-brand-assets.py) centre the INK BOX,
     so left equals right and top equals bottom. A head-up five-fold mark is always wider
     than tall, so in a square each vertical margin is larger than each horizontal one by
     (w - h) / 2; only turning the mark 9.00 degrees makes all four equal, and that tilts
     the heads. Under a circular mask keep the enclosing circle inside the frame: centred on
     the ink box that holds while the mark width is at most 0.887 of the frame, so pad
     circular exports.

     JOINS & SEAMS. Where two ribbons abut, the union outline crosses from one copy to the next at
     two points: the outer join, where the outer edges meet tangent-continuous so the ring reads
     as one unbroken band, and the inner join, the corner of the void where one ribbon's inner
     edge passes under the next:
       outer join, at (251.822 129.569) = rotate(72) of (577.618 188.012)
       inner join, at (240.141 220.338) = rotate(72) of (487.682 204.952)

     HEADS. One circle, r 58.65, centre 312.92 from the rotation centre — the master's
     proportions (assets/circle/4.png, measured: r 60.8, centre 310.2, both in these units).
     What that buys is the gap between a head and the shoulder below it: 22.88 units here
     against the master's 23.15. The trace had the head 3.57 units further in, closing the
     gap to 19.58, which read crowded. Moving the head out rather than shrinking it keeps
     the head's mass: at a given gap a smaller head reads as a dot, not a figure. #head-axis
     is centred on the circle and travels with it; at 126.358 long against the 117.30
     diameter the head spans the middle 0.036 to 0.964 of that ramp, so neither end of the
     head shading reaches the stop colours.

     SEAM CURVE. Traced from the original master (assets/circle/4.png), then refitted as one
     cubic with a convex control polygon, so its curvature is single-signed (no inflection;
     the trace had a slight hook just before the inner join). Its end tangents are the
     trace's: at the outer join it leaves the outer edge at the 17.15-degree wedge-tip angle,
     at the inner join it is tangent to the inner edge and matches its curvature (G2), so
     the wedge tapers out of the inner edge without a break. Fourteen cubics: cap, five
     inner-edge, wedge, seven outer-edge; every edge junction is exactly G1, including the
     outer join across copies. Nothing is stroked and nothing is clipped.

     COLOUR is the brand hue palette (design-system/colors_and_type.css), clockwise from the top in
     the order of the previous icon.svg: aqua, blue, emerald, violet, mint. The five
     gradient-<hue> fills inherit one #ribbon-axis (userSpaceOnUse, unrotated frame; the
     rotate lives on each <use>, so the paint turns with its ribbon) and share one OKLab
     lightness profile: deep at
     the leading seam, light at the trailing seam, clockwise, the same depth on every ribbon,
     smoothed (largest slope jump 0.12). The profile's zero is the base token, present as an
     exact stop at offset 0.435; hues follow each hue's 600 -> base -> light ramp. The
     head-<hue> fills are the previous icon's dot colours with one shared lightness step, on
     the previous icon's head axis (#head-axis: top edge to bottom edge, light end 21.8
     degrees counter-clockwise from outward). Regenerate with the pipeline (polish.py,
     brandmaster.py) rather than hand-editing hexes. -->
<defs>
<path id="sw-ribbon" d="M251.822 129.569C225.217 146.988 232.086 191.44 240.141 220.338C252.798 209.967 271.894 209.174 287.05 213.373C300.471 217.091 312.46 224.481 324.756 230.808C337.68 237.458 351.179 243.121 365.484 246.059C394.382 251.995 424.073 245.073 449.488 230.795C463.111 223.142 474.771541 213.521675 487.681541 204.951675C512.67604 188.360942 552.829767 168.091711 577.617617 188.011803C557.996617 158.992803 527.883 136.68 493.532 128.783C479.521 125.562 464.884 124.891 450.776 127.98C434.357 131.575 421.266 140.456 406.004 146.658C395.45 150.947 384.177 153.332 372.75 152.747C359.914 152.09 347.874 147.808 336.387 142.279C327.657 138.077 319.135 133.397 309.972 130.166C291.124 123.52 270.874 124.083 251.822 129.569Z"/>
<circle id="sw-head" cx="374.5" cy="70.08" r="58.65"/>
<linearGradient id="sw-ribbon-axis" gradientUnits="userSpaceOnUse" x1="236.232" y1="170.556" x2="557.445" y2="187.401"/>
<linearGradient id="sw-gradient-aqua" href="#sw-ribbon-axis"><stop offset="0" stop-color="#018985"/><stop offset="0.062" stop-color="#03938F"/><stop offset="0.125" stop-color="#049E99"/><stop offset="0.188" stop-color="#04A7A2"/><stop offset="0.25" stop-color="#04ADA8"/><stop offset="0.312" stop-color="#05B2AD"/><stop offset="0.375" stop-color="#03B7B1"/><stop offset="0.435" stop-color="#02BBB5"/><stop offset="0.5" stop-color="#02C0B9"/><stop offset="0.562" stop-color="#04C4BE"/><stop offset="0.625" stop-color="#04C8C1"/><stop offset="0.688" stop-color="#02CCC5"/><stop offset="0.75" stop-color="#01CFC8"/><stop offset="0.812" stop-color="#03D3CC"/><stop offset="0.875" stop-color="#03D5CE"/><stop offset="0.938" stop-color="#06D6CF"/><stop offset="1" stop-color="#02D4CD"/></linearGradient>
<linearGradient id="sw-gradient-blue" href="#sw-ribbon-axis"><stop offset="0" stop-color="#005AB3"/><stop offset="0.062" stop-color="#0563C1"/><stop offset="0.125" stop-color="#0B6CD0"/><stop offset="0.188" stop-color="#1073DD"/><stop offset="0.25" stop-color="#1278E8"/><stop offset="0.312" stop-color="#127CF0"/><stop offset="0.375" stop-color="#1280F8"/><stop offset="0.435" stop-color="#1283FF"/><stop offset="0.5" stop-color="#1F88FF"/><stop offset="0.562" stop-color="#298DFF"/><stop offset="0.625" stop-color="#3191FF"/><stop offset="0.688" stop-color="#3996FF"/><stop offset="0.75" stop-color="#3F9AFF"/><stop offset="0.812" stop-color="#459DFF"/><stop offset="0.875" stop-color="#4AA0FF"/><stop offset="0.938" stop-color="#4AA0FF"/><stop offset="1" stop-color="#479EFF"/></linearGradient>
