<linearGradient id="sw-gradient-mint" href="#sw-ribbon-axis"><stop offset="0" stop-color="#12A84C"/><stop offset="0.062" stop-color="#26B155"/><stop offset="0.125" stop-color="#35BB5F"/><stop offset="0.188" stop-color="#40C468"/><stop offset="0.25" stop-color="#47CA6F"/><stop offset="0.312" stop-color="#4CCF75"/><stop offset="0.375" stop-color="#51D37B"/><stop offset="0.435" stop-color="#55D77F"/><stop offset="0.5" stop-color="#62DA88"/><stop offset="0.562" stop-color="#6CDC90"/><stop offset="0.625" stop-color="#74DF97"/><stop offset="0.688" stop-color="#7AE29B"/><stop offset="0.75" stop-color="#7EE6A0"/><stop offset="0.812" stop-color="#81E9A2"/><stop offset="0.875" stop-color="#83EBA4"/><stop offset="0.938" stop-color="#84ECA5"/><stop offset="1" stop-color="#82EAA3"/></linearGradient>
<linearGradient id="sw-head-axis" gradientUnits="userSpaceOnUse" x1="351.036" y1="11.420" x2="397.964" y2="128.740"/>
<linearGradient id="sw-head-aqua" href="#sw-head-axis"><stop offset="0" stop-color="#00CFC9"/><stop offset="1" stop-color="#19B0AB"/></linearGradient>
