<linearGradient id="sw-head-emerald" href="#sw-head-axis"><stop offset="0" stop-color="#00D9B3"/><stop offset="1" stop-color="#19B899"/></linearGradient>
<linearGradient id="sw-head-violet" href="#sw-head-axis"><stop offset="0" stop-color="#8463D6"/><stop offset="1" stop-color="#673FCC"/></linearGradient>
